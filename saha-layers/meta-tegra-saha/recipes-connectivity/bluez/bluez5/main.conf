[General]
Name = Roban-Bluetooth
ControllerMode = le
Privacy = device
# This device is a BLE peripheral. Reverse discovery of Android central GATT
# services can trigger an unwanted SMP security request and pairing dialog.
ReverseServiceDiscovery = false

[LE]
MinAdvertisementInterval=0x00a0
MaxAdvertisementInterval=0x00f0

[Policy]
AutoEnable=true
