services:
  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:2026.7.1
    depends_on:
      matter-server:
        condition: service_healthy
    volumes:
      - /var/lib/homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
      - /run/saha:/run/saha
    restart: on-failure:5
    privileged: true
    network_mode: host
    environment:
      TZ: ${TZ:-Asia/Shanghai}

  homeassistant-mcp:
    container_name: homeassistant-mcp
    image: ${SAHA_HOMEASSISTANT_MCP_IMAGE:-roban-ha-mcp:arm64}
    restart: on-failure:5
    network_mode: host
    depends_on:
      homeassistant:
        condition: service_started
    env_file:
      - /etc/default/home-assistant-mcp
      - ${SAHA_HOMEASSISTANT_MCP_CREDENTIALS_FILE:-/data/saha/homeassistant-mcp/credentials.env}
    volumes:
      - /data/saha/homeassistant:/data/saha/homeassistant
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true

  matter-server:
    container_name: matter-server
    image: ghcr.io/matter-js/python-matter-server:arm64
    restart: on-failure:5
    network_mode: host
    security_opt:
      - apparmor:unconfined
    volumes:
      - /var/lib/matter-server:/data
      - /run/dbus:/run/dbus:ro
      - /opt/roban/compose/saha-matter-server-offline.py:/opt/saha-matter-server-offline.py:ro
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    extra_hosts:
      - on.dcl.csa-iot.org=127.0.0.1
      - on.test-net.dcl.csa-iot.org=127.0.0.1
      - api.github.com=127.0.0.1
      - raw.githubusercontent.com=127.0.0.1
    entrypoint:
      - python3
      - /opt/saha-matter-server-offline.py
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import socket; socket.create_connection(('127.0.0.1', 5580), 2).close()"
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s
    command:
      - --storage-path
      - /data
      - --paa-root-cert-dir
      - /data/credentials
      - --primary-interface
      - wlan0
      - --bluetooth-adapter
      - "0"

  roban-workflow-api:
    container_name: roban-workflow-api
    image: roban-workflow-api:arm64
    restart: on-failure:5
    network_mode: host
    volumes:
      - /run/saha/board-status:/run/saha/board-status:ro
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      BOARD_STATUS_DIR: /run/saha/board-status

  livekit-server:
    container_name: livekit-server
    image: ${SAHA_LIVEKIT_SERVER_IMAGE:-livekit/livekit-server:v1.13.4}
    restart: on-failure:5
    network_mode: host
    env_file:
      - ${SAHA_LIVEKIT_CREDENTIALS_FILE:-/var/lib/saha/livekit/credentials.env}
    command:
      - --bind
      - 0.0.0.0
      - --udp-port
      - "7882"

  livekit-agent:
    container_name: livekit-agent
    image: ${SAHA_LIVEKIT_AGENT_IMAGE:-livekit-agent:arm64}
    restart: on-failure:5
    network_mode: host
    depends_on:
      - livekit-server
    env_file:
      - ${SAHA_LIVEKIT_CREDENTIALS_FILE:-/var/lib/saha/livekit/credentials.env}
    environment:
      LIVEKIT_URL: ws://127.0.0.1:7880
      LIVEKIT_AGENT_NAME: ${SAHA_LIVEKIT_AGENT_NAME:-roban-agent}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ROBAN_TOKEN_PORT: "7883"
