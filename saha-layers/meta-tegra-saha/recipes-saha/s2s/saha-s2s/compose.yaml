services:
  roban-s2s:
    image: ${SAHA_S2S_IMAGE:-roban-s2s:arm64}
    container_name: saha-s2s
    runtime: nvidia
    network_mode: host
    restart: "no"
    init: true
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      CUDA_VISIBLE_DEVICES: "0"
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
      PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      ROBAN_S2S_HOST: 0.0.0.0
      ROBAN_S2S_PORT: ${SAHA_S2S_PORT:-8765}
      ROBAN_S2S_MODEL_ROOT: /models
      ROBAN_S2S_CACHE_DIR: /var/cache/roban-s2s
      ROBAN_S2S_KWS_MODEL_DIR: /models/kws
      ROBAN_S2S_VAD_MODEL_PATH: /models/silero_vad.onnx
      ROBAN_S2S_STT_MODEL_PATH: /models/stt
      ROBAN_S2S_TTS_MODEL_PATH: /models/tts
      ROBAN_S2S_KWS_PROVIDER: ${ROBAN_S2S_KWS_PROVIDER:-cuda}
      ROBAN_S2S_VAD_PROVIDER: ${ROBAN_S2S_VAD_PROVIDER:-cuda}
      ROBAN_S2S_STT_PROVIDER: ${ROBAN_S2S_STT_PROVIDER:-cuda}
      ROBAN_S2S_TTS_PROVIDER: ${ROBAN_S2S_TTS_PROVIDER:-cuda}
      ROBAN_S2S_STT_BACKEND: ${ROBAN_S2S_STT_BACKEND:-sherpa-onnx}
      ROBAN_S2S_LLM_BACKEND: ${ROBAN_S2S_LLM_BACKEND:-openai-compatible}
      ROBAN_S2S_LLM_MODEL: ${ROBAN_S2S_LLM_MODEL:-}
      ROBAN_S2S_LLM_BASE_URL: ${ROBAN_S2S_LLM_BASE_URL:-http://127.0.0.1:8080/v1}
      ROBAN_S2S_TTS_BACKEND: ${ROBAN_S2S_TTS_BACKEND:-qwen3-tts}
      ROBAN_S2S_PIPELINE_FACTORY: ${ROBAN_S2S_PIPELINE_FACTORY:-}
      ROBAN_S2S_ICE_SERVERS: ${ROBAN_S2S_ICE_SERVERS:-[]}
      ROBAN_S2S_MAX_SESSIONS: "1"
    volumes:
      - /proc/stat:/host/proc/stat:ro
      - /proc/meminfo:/host/proc/meminfo:ro
      - /data/models/s2s:/models:ro
      - /data/model-cache/s2s:/var/cache/roban-s2s
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:'+os.getenv('ROBAN_S2S_PORT','8765')+'/ready', timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 30s
