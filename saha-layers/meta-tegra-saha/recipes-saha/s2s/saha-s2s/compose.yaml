services:
  roban-s2s:
    image: ${SAHA_S2S_IMAGE:-roban-s2s:20260831-media-control-fix-arm64}
    container_name: saha-s2s
    network_mode: host
    restart: "no"
    init: true
    group_add:
      - "999"
    environment:
      ROBAN_S2S_IMAGE_PROFILE: realtime-cpu
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
      PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      ROBAN_S2S_HOST: 0.0.0.0
      ROBAN_S2S_PORT: ${SAHA_S2S_PORT:-8765}
      ROBAN_S2S_MODEL_ROOT: /models
      ROBAN_S2S_CACHE_DIR: /var/cache/roban-s2s
      ROBAN_S2S_SELECTION_PATH: /model-config/selection.json
      ROBAN_S2S_MODE_PATH: /model-config/pipeline-mode.json
      ROBAN_S2S_REALTIME_SETTINGS_PATH: /model-config/realtime-settings.json
      ROBAN_S2S_TOOL_PLUGIN_ROOT: /app/roban_voice_s2s/tool_plugins
      ROBAN_S2S_GROK_TOKEN_PATH: /model-secrets/sub2api.token
      ROBAN_S2S_DASHSCOPE_API_KEY_PATH: /model-secrets/dashscope-api-key
      ROBAN_S2S_DASHSCOPE_WORKSPACE_ID_PATH: /model-config/dashscope-workspace-id
      ROBAN_S2S_GROK_ENDPOINT: https://api.roban.ai/v1
      ROBAN_S2S_GROK_MODEL: grok-voice-latest
      ROBAN_S2S_VOICEPRINT_DIR: ${ROBAN_S2S_VOICEPRINT_DIR:-/var/lib/roban-s2s/voiceprints}
      ROBAN_S2S_VOICE_REFERENCE_TEMP_DIR: /voice-temp
      ROBAN_S2S_SPEAKER_PROVIDER: ${ROBAN_S2S_SPEAKER_PROVIDER:-cpu}
      ROBAN_S2S_WESPEAKER_THRESHOLD: ${ROBAN_S2S_WESPEAKER_THRESHOLD:-}
      ROBAN_S2S_TITANET_THRESHOLD: ${ROBAN_S2S_TITANET_THRESHOLD:-}
      ROBAN_S2S_KWS_MODEL_DIR: /models/kws
      ROBAN_S2S_VAD_MODEL_PATH: /models/silero_vad.onnx
      ROBAN_S2S_KWS_PROVIDER: ${ROBAN_S2S_KWS_PROVIDER:-cpu}
      ROBAN_S2S_VAD_PROVIDER: ${ROBAN_S2S_VAD_PROVIDER:-cpu}
      ROBAN_S2S_PIPELINE_FACTORY: roban_voice_s2s.production_pipeline:create_pipeline
      ROBAN_S2S_ICE_SERVERS: ${ROBAN_S2S_ICE_SERVERS:-[]}
      ROBAN_S2S_MAX_SESSIONS: "1"
      ROBAN_S2S_HA_MCP_URL: http://127.0.0.1:8000/mcp
      ROBAN_S2S_WORKFLOW_MCP_URL: http://127.0.0.1:8001/mcp
      ROBAN_S2S_HA_MCP_CREDENTIALS_PATH: /mcp-secrets/homeassistant.env
      ROBAN_S2S_WORKFLOW_MCP_CREDENTIALS_PATH: /mcp-secrets/workflow.env
    volumes:
      - /proc/stat:/host/proc/stat:ro
      - /proc/meminfo:/host/proc/meminfo:ro
      - /data/models/s2s:/models:ro
      - /data/model-config/s2s:/model-config:ro
      - /data/model-secrets/s2s:/model-secrets:ro
      - /data/saha/homeassistant-mcp/credentials.env:/mcp-secrets/homeassistant.env:ro
      - /data/saha/workflow-mcp/credentials.env:/mcp-secrets/workflow.env:ro
      - /data/model-cache/s2s:/var/cache/roban-s2s
      - /data/voiceprints/s2s:/var/lib/roban-s2s/voiceprints:rw
      - /data/model-config/s2s/voice-temp:/voice-temp:rw
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:'+os.getenv('ROBAN_S2S_PORT','8765')+'/health', timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 30s

  roban-cosyvoice:
    profiles: ["cosyvoice"]
    image: ${SAHA_COSYVOICE_IMAGE:-roban-cosyvoice:arm64}
    container_name: saha-cosyvoice
    runtime: nvidia
    network_mode: host
    restart: "no"
    init: true
    group_add:
      - "999"
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      CUDA_VISIBLE_DEVICES: "0"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HOME: /tmp/huggingface
      NUMBA_CACHE_DIR: /tmp/numba
      MPLCONFIGDIR: /tmp/matplotlib
      TRITON_CACHE_DIR: /var/cache/roban-cosyvoice/triton
      ROBAN_COSYVOICE_HOST: 127.0.0.1
      ROBAN_COSYVOICE_PORT: ${SAHA_COSYVOICE_PORT:-8766}
      ROBAN_COSYVOICE_MODEL_DIR: /models/Fun-CosyVoice3-0.5B-2512
      ROBAN_COSYVOICE_VOICE_ROOT: /voices
      ROBAN_COSYVOICE_CACHE_ROOT: /var/cache/roban-cosyvoice/voices
      ROBAN_COSYVOICE_FP16: "1"
    volumes:
      - /data/models/s2s/tts/cosyvoice3:/models:ro
      - /data/model-config/s2s/voices:/voices:ro
      - /data/model-cache/s2s/cosyvoice3:/var/cache/roban-cosyvoice
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:'+os.getenv('ROBAN_COSYVOICE_PORT','8766')+'/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 180s
