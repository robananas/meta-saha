header:
  version: 17

local_conf_header:
  saha-s2s: |
    CORE_IMAGE_BASE_INSTALL:append:pn-saha-image-robot = " packagegroup-saha-s2s"
    CORE_IMAGE_BASE_INSTALL:append:pn-saha-image-robot-docker = " packagegroup-saha-s2s"
